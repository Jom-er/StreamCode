<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamCode</title>
    <style>
        :root {
            /* Light Theme Palette - Sleek & Clean */
            --bg-base: #f3f4f6;
            --bg-panel: #ffffff;
            --bg-sidebar: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --error: #ef4444;
            --success: #10b981;
            --font-ui: 'Inter', system-ui, -apple-system, sans-serif;
            --font-code: 'Fira Code', 'Courier New', Courier, monospace;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        [data-theme="dark"] {
            /* Dark Theme Palette - Deep & Professional */
            --bg-base: #030712;
            --bg-panel: #111827;
            --bg-sidebar: #0f172a;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
            --accent: #818cf8;
            --accent-hover: #6366f1;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        button {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-family: inherit;
            outline: none;
        }

        .app-header {
            height: 56px;
            min-height: 56px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 20;
        }

        .header-brand {
            font-weight: 700;
            font-size: 1.125rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        .header-brand svg {
            color: var(--accent);
        }

        .header-dynamic-text {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background-color: var(--bg-base);
            border-color: var(--text-muted);
        }
        
        .app-body {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            width: 100%;
        }

        .app-footer {
            height: 36px;
            min-height: 36px;
            background-color: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            z-index: 20;
        }

        .footer-links {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .footer-links a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        .sidebar {
            width: 64px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 0;
            z-index: 10;
            box-shadow: var(--shadow-sm);
        }

        .sidebar-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sidebar-btn {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: all 0.2s ease;
            position: relative;
        }

        .sidebar-btn:hover {
            background-color: var(--bg-base);
            color: var(--text-main);
            transform: scale(1.05);
        }

        .sidebar-btn.active {
            color: var(--accent);
            background-color: rgba(99, 102, 241, 0.1);
        }

        /* Tooltip */
        .sidebar-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 100%;
            margin-left: 10px;
            background-color: var(--text-main);
            color: var(--bg-panel);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-10px);
            transition: all 0.2s ease;
            z-index: 20;
        }

        .sidebar-btn:hover::after {
            opacity: 1;
            transform: translateX(0);
        }

        .workspace {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            padding: 1rem;
            gap: 1rem;
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            position: relative;
            min-width: 0;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .panel-header {
            height: 48px;
            padding: 0 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-panel);
        }

        .panel-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .status-badge {
            font-size: 0.75rem;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .status-badge.show {
            opacity: 1;
        }

        .status-badge::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: currentColor;
            border-radius: 50%;
        }

        .editor-wrapper {
            flex: 1;
            position: relative;
            background-color: var(--bg-panel);
        }

        .code-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 1.25rem;
            font-family: var(--font-code);
            font-size: 14px;
            line-height: 1.6;
            white-space: pre;
            overflow: auto;
            tab-size: 4;
            border: none;
            outline: none;
            resize: none;
            color: var(--text-main);
            background-color: transparent;
            caret-color: var(--accent);
        }

        .preview-frame {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #ffffff; /* Preview always runs in a contained environment, but we control its internal body color */
        }

        .resizer {
            width: 6px;
            margin: 0 -3px;
            background-color: transparent;
            cursor: col-resize;
            transition: background-color 0.2s ease;
            z-index: 5;
            border-radius: 3px;
            position: relative;
        }

        .resizer::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 30px;
            width: 4px;
            background-color: var(--border-color);
            border-radius: 2px;
            transition: background-color 0.2s ease;
        }

        .resizer:hover::after, .resizer:active::after {
            background-color: var(--accent);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active { 
            display: flex; 
            opacity: 1;
        }

        .modal-content {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            position: relative;
            box-shadow: var(--shadow-lg);
            transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .modal-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            margin-bottom: 1.25rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-base);
            color: var(--text-main);
            border-radius: var(--radius-md);
            font-family: inherit;
            transition: border-color 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 0.875rem;
            background-color: var(--accent);
            color: #ffffff;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .form-switch {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 1.5rem;
            text-align: center;
            width: 100%;
            font-weight: 500;
        }

        .form-switch:hover { color: var(--accent); }

        .form-message {
            color: var(--error);
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
            padding: 0.75rem;
            background-color: rgba(239, 68, 68, 0.1);
            border-radius: var(--radius-md);
            display: none;
        }

        .modal-close {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            color: var(--text-muted);
            padding: 4px;
            border-radius: 4px;
        }
        
        .modal-close:hover {
            background-color: var(--bg-base);
            color: var(--text-main);
        }

        .notification-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1000;
            pointer-events: none;
        }

        .notification {
            padding: 12px 24px;
            border-radius: var(--radius-md);
            background-color: var(--bg-panel);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notification.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* Embed Mode Styles - Clean standalone output for iframes */
        body[data-embed="true"] .app-header,
        body[data-embed="true"] .sidebar,
        body[data-embed="true"] .app-footer,
        body[data-embed="true"] #panel-editor,
        body[data-embed="true"] .resizer {
            display: none !important;
        }
        body[data-embed="true"] .workspace {
            padding: 0 !important;
            gap: 0 !important;
        }
        body[data-embed="true"] #panel-preview {
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .app-body { flex-direction: column; }
            .header-dynamic-text { display: none; }
            .sidebar {
                width: 100%;
                height: 60px;
                flex-direction: row;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 0 1rem;
                box-shadow: none;
            }
            .sidebar-group { flex-direction: row; }
            .sidebar-btn::after { display: none; } /* Hide tooltips on mobile */
            .workspace { flex-direction: column; padding: 0.5rem; }
            .resizer { 
                width: 100%; 
                height: 8px; 
                margin: -4px 0; 
                cursor: row-resize; 
            }
            .resizer::after {
                width: 30px;
                height: 4px;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <header class="app-header">
        <div class="header-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>
            StreamCode
        </div>
        <div class="header-dynamic-text" id="header-greeting">Welcome, Guest</div>
        <div class="header-actions">
            <button class="btn-secondary" id="btn-share" title="Copy shareable link">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
                Share Link
            </button>
            <button class="btn-primary" style="padding: 0.5rem 1rem;" id="header-action-btn">Sign In</button>
        </div>
    </header>

    <div class="app-body">
        <aside class="sidebar">
            <div class="sidebar-group">
                <button class="sidebar-btn" id="btn-theme" data-tooltip="Toggle Theme">
            </button>
        </div>
    </aside>

    <main class="workspace">
        <!-- Editor Panel -->
        <section class="panel" id="panel-editor">
            <header class="panel-header">
                <span class="panel-title">Editor</span>
                <span class="status-badge" id="sync-status">Saved</span>
            </header>
            <div class="editor-wrapper">
                <!-- Pure, native textarea. No injected spans. -->
                <textarea class="code-input" id="code-input" spellcheck="false" placeholder="Write HTML, CSS, JavaScript, or JSON here..."></textarea>
            </div>
        </section>

        <!-- Resizer -->
        <div class="resizer" id="resizer"></div>

        <!-- Preview Panel -->
        <section class="panel" id="panel-preview">
            <header class="panel-header">
                <span class="panel-title">Output</span>
            </header>
            <iframe class="preview-frame" id="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
        </section>
    </main>
    </div>

    <footer class="app-footer">
        <div id="footer-copyright">© 2026 StreamCode</div>
        <div class="footer-links">
            <span id="footer-status" style="display:flex; align-items:center; gap:6px;"><span style="display:inline-block; width:8px; height:8px; border-radius:50%; background-color:var(--success); box-shadow: 0 0 8px var(--success);"></span> All systems operational</span>
            <span style="margin: 0 0.25rem; opacity: 0.3;">|</span>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <span style="margin: 0 0.25rem; opacity: 0.3;">|</span>
            <span id="footer-time" style="font-family: var(--font-code);">00:00 AM</span>
        </div>
    </footer>

    <div class="modal-overlay" id="auth-modal">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"></path></svg>
            </button>
            <h2 class="modal-title" id="auth-title">Welcome back</h2>
            <p class="modal-subtitle" id="auth-subtitle">Log in to securely save and sync your workspaces across devices.</p>
            
            <form id="auth-form">
                <input type="email" class="form-input" id="auth-email" placeholder="Email address" required>
                <input type="password" class="form-input" id="auth-password" placeholder="Password" minlength="6" required>
                <div class="form-message" id="auth-message"></div>
                <button type="submit" class="btn-primary" id="auth-submit">Log In</button>
            </form>
            
            <button class="form-switch" id="auth-switch" type="button">Don't have an account? Sign up</button>
            <button class="form-switch" id="auth-logout" style="display:none; color:var(--error);" type="button">Sign Out</button>
        </div>
    </div>

    <!-- Share & Embed Modal -->
    <div class="modal-overlay" id="share-modal">
        <div class="modal-content" style="max-width: 500px;">
            <button class="modal-close" id="share-modal-close">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"></path></svg>
            </button>
            <h2 class="modal-title">Share & Embed Workspace</h2>
            <p class="modal-subtitle">Share your live preview link or grab the iframe code to embed it anywhere.</p>
            
            <div style="margin-bottom: 1.25rem;">
                <label style="display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem;">Direct Link</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" class="form-input" id="share-url-input" readonly style="margin-bottom: 0;">
                    <button class="btn-primary" id="btn-copy-url" style="width: auto; padding: 0 1.25rem; white-space: nowrap;">Copy Link</button>
                </div>
            </div>

            <div>
                <label style="display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem;">Embed Code (HTML iframe)</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" class="form-input" id="share-embed-input" readonly style="margin-bottom: 0; font-family: var(--font-code); font-size: 11px;">
                    <button class="btn-primary" id="btn-copy-embed" style="width: auto; padding: 0 1.25rem; white-space: nowrap;">Copy Embed</button>
                </div>
            </div>
        </div>
    </div>

    <div class="notification-container" id="notification-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global State
        let auth, db, activeUser = null, isDbReady = false;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'streamcode-app';

        const elements = {
            input: document.getElementById('code-input'),
            frame: document.getElementById('preview-frame'),
            editorPanel: document.getElementById('panel-editor'),
            resizer: document.getElementById('resizer'),
            btnTheme: document.getElementById('btn-theme'),
            syncStatus: document.getElementById('sync-status'),
            authModal: document.getElementById('auth-modal'),
            modalClose: document.getElementById('modal-close'),
            authForm: document.getElementById('auth-form'),
            authTitle: document.getElementById('auth-title'),
            authSubtitle: document.getElementById('auth-subtitle'),
            authSwitch: document.getElementById('auth-switch'),
            authLogout: document.getElementById('auth-logout'),
            authMessage: document.getElementById('auth-message'),
            email: document.getElementById('auth-email'),
            password: document.getElementById('auth-password'),
            notifContainer: document.getElementById('notification-container'),
            headerActionBtn: document.getElementById('header-action-btn'),
            headerGreeting: document.getElementById('header-greeting'),
            footerTime: document.getElementById('footer-time'),
            footerCopyright: document.getElementById('footer-copyright'),
            shareModal: document.getElementById('share-modal'),
            shareModalClose: document.getElementById('share-modal-close'),
            shareUrlInput: document.getElementById('share-url-input'),
            shareEmbedInput: document.getElementById('share-embed-input'),
            btnCopyUrl: document.getElementById('btn-copy-url'),
            btnCopyEmbed: document.getElementById('btn-copy-embed')
        };

        let isDarkMode = true;
        let isSignUpMode = false;
        let typingTimer;
        let syncTimer;
        let isLoadedFromCloud = false;
        let isDraggingState = false;

        const handleShare = () => {
            if (!elements.input) return;
            try {
                const code = elements.input.value;
                const encoded = btoa(encodeURIComponent(code));
                const shareUrl = `${window.location.origin}${window.location.pathname}#code=${encoded}`;
                const embedUrl = `${window.location.origin}${window.location.pathname}?embed=true#code=${encoded}`;
                const embedCode = `<iframe src="${embedUrl}" width="100%" height="450px" style="border:1px solid var(--border-color); border-radius:var(--radius-lg); background:var(--bg-panel);" sandbox="allow-scripts allow-same-origin"></iframe>`;

                if (elements.shareUrlInput) elements.shareUrlInput.value = shareUrl;
                if (elements.shareEmbedInput) elements.shareEmbedInput.value = embedCode;
                if (elements.shareModal) elements.shareModal.classList.add('active');
            } catch (err) {
                showNotification("Failed to generate share link.", "error");
            }
        };

        const copyTextToClipboard = (text, successMsg) => {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showNotification(successMsg);
                }).catch(() => {
                    copyToClipboardFallback(text, successMsg);
                });
            } else {
                copyToClipboardFallback(text, successMsg);
            }
        };

        const copyToClipboardFallback = (text, successMsg) => {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                showNotification(successMsg);
            } catch (err) {
                showNotification("Could not copy to clipboard.", "error");
            }
            document.body.removeChild(textarea);
        };

        const setupFirebase = async () => {
            try {
                const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
                const app = initializeApp(config);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                isDbReady = true;

                onAuthStateChanged(auth, (user) => {
                    activeUser = user;
                    updateDynamicElements();
                    if (user && user.email) {
                        if (elements.headerActionBtn) elements.headerActionBtn.textContent = "My Account";
                        if (elements.authTitle) elements.authTitle.textContent = "Account Active";
                        if (elements.authSubtitle) elements.authSubtitle.textContent = `Logged in as ${user.email}`;
                        if (elements.authForm) elements.authForm.style.display = 'none';
                        if (elements.authSwitch) elements.authSwitch.style.display = 'none';
                        if (elements.authLogout) elements.authLogout.style.display = 'block';
                        loadCloudData(user.uid);
                    } else {
                        if (elements.headerActionBtn) elements.headerActionBtn.textContent = "Sign In";
                        if (elements.authTitle) elements.authTitle.textContent = "Welcome back";
                        if (elements.authSubtitle) elements.authSubtitle.textContent = "Log in to securely save and sync your workspaces across devices.";
                        if (elements.authForm) elements.authForm.style.display = 'block';
                        if (elements.authSwitch) elements.authSwitch.style.display = 'block';
                        if (elements.authLogout) elements.authLogout.style.display = 'none';
                        isSignUpMode = false;
                    }
                });
            } catch (error) {
                showNotification("Unable to connect to database.", "error");
            }
        };

        const saveToCloud = async () => {
            if (!isDbReady || !activeUser || !activeUser.email || !elements.input) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', activeUser.uid, 'data', 'workspace');
                await setDoc(docRef, { code: elements.input.value, updated: Date.now() });
                
                if (elements.syncStatus) {
                    elements.syncStatus.classList.add('show');
                    setTimeout(() => { elements.syncStatus.classList.remove('show'); }, 2000);
                }
            } catch (error) {
                console.error("Sync Error", error);
            }
        };

        const loadCloudData = async (uid) => {
            if (!isDbReady || isLoadedFromCloud || !elements.input) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'users', uid, 'data', 'workspace');
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && typeof docSnap.data().code === 'string') {
                    elements.input.value = docSnap.data().code;
                    handleInput();
                }
            } catch (error) {
                console.error("Load Error", error);
            }
        };

        const escapeHtml = (unsafe) => {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        };

        const renderPreview = () => {
            if (!elements.input || !elements.frame) return;
            const code = elements.input.value;
            const hasHtmlTags = /<\/?(html|body|div|span|script|style|p|h[1-6]|a|img|br|button|input|form|table|svg)[^>]*>/i.test(code);
            
            let finalHtml = code;
            
            if (!hasHtmlTags && code.trim() !== '') {
                const bgColor = isDarkMode ? '#111827' : '#ffffff';
                const textColor = isDarkMode ? '#f9fafb' : '#111827';
                
                let displayCode = code;
                try {
                    if (code.trim().startsWith('{') || code.trim().startsWith('[')) {
                        displayCode = JSON.stringify(JSON.parse(code.trim()), null, 2);
                    }
                } catch(e) {}

                finalHtml = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <style>
                            body { 
                                margin: 0; 
                                padding: 1.5rem; 
                                font-family: 'Fira Code', 'Courier New', monospace; 
                                font-size: 14px; 
                                line-height: 1.6; 
                                background-color: ${bgColor}; 
                                color: ${textColor}; 
                            }
                            pre { 
                                margin: 0; 
                                white-space: pre-wrap; 
                                word-wrap: break-word; 
                            }
                        </style>
                    </head>
                    <body><pre>${escapeHtml(displayCode)}</pre></body>
                    </html>
                `;
            }

            const blob = new Blob([finalHtml], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            elements.frame.onload = () => URL.revokeObjectURL(url);
            elements.frame.src = url;
        };

        const handleInput = () => {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(renderPreview, 250);

            if (activeUser && activeUser.email) {
                clearTimeout(syncTimer);
                syncTimer = setTimeout(saveToCloud, 1500);
            }
        };

        const showNotification = (message, type = 'success') => {
            if (!elements.notifContainer) return;
            const notif = document.createElement('div');
            notif.className = `notification`;
            
            const iconColor = type === 'error' ? 'var(--error)' : 'var(--accent)';
            const icon = type === 'error' 
                ? `<svg width="18" height="18" fill="none" stroke="${iconColor}" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`
                : `<svg width="18" height="18" fill="none" stroke="${iconColor}" stroke-width="2" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
            
            notif.innerHTML = `${icon} <span>${message}</span>`;
            elements.notifContainer.appendChild(notif);
            
            requestAnimationFrame(() => notif.classList.add('show'));
            
            setTimeout(() => {
                notif.classList.remove('show');
                setTimeout(() => notif.remove(), 300);
            }, 3000);
        };

        const toggleModal = (show) => {
            if (!elements.authModal) return;
            elements.authModal.classList.toggle('active', show);
            if (!show && elements.authMessage && elements.authForm) {
                elements.authMessage.style.display = 'none';
                elements.authForm.reset();
            }
        };

        const loadUrlState = () => {
            // Check if embed mode is requested via query param
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('embed') === 'true') {
                document.body.setAttribute('data-embed', 'true');
            }

            if (!elements.input) return false;
            if (window.location.hash.startsWith('#code=')) {
                try {
                    elements.input.value = decodeURIComponent(atob(window.location.hash.substring(6)));
                    isLoadedFromCloud = true;
                    return true;
                } catch (e) {
                    console.error("Invalid URL payload");
                }
            }
            return false;
        };

        const updateDynamicElements = () => {
            const now = new Date();
            const hours = now.getHours();
            let greeting = 'Good evening';
            
            if (hours < 12) greeting = 'Good morning';
            else if (hours < 18) greeting = 'Good afternoon';

            if (elements.headerGreeting) {
                const name = (activeUser && activeUser.email) ? activeUser.email.split('@')[0] : 'Guest';
                elements.headerGreeting.textContent = `${greeting}, ${name}`;
            }

            if (elements.footerTime) {
                elements.footerTime.textContent = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            }
            
            if (elements.footerCopyright) {
                elements.footerCopyright.textContent = `© ${now.getFullYear()} StreamCode. All rights reserved.`;
            }
        };

        setInterval(updateDynamicElements, 1000);
        updateDynamicElements();

        if (elements.input) {
            elements.input.addEventListener('input', handleInput);
            elements.input.addEventListener('keydown', (e) => {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = elements.input.selectionStart;
                    const end = elements.input.selectionEnd;
                    elements.input.value = elements.input.value.substring(0, start) + "    " + elements.input.value.substring(end);
                    elements.input.selectionStart = elements.input.selectionEnd = start + 4;
                    handleInput();
                }
            });
        }

        if (elements.btnTheme) {
            elements.btnTheme.addEventListener('click', () => {
                isDarkMode = !isDarkMode;
                document.body.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
                renderPreview(); 
            });
        }

        const shareBtn = document.getElementById('btn-share');
        if (shareBtn) {
            shareBtn.addEventListener('click', handleShare);
        }

        if (elements.shareModalClose) {
            elements.shareModalClose.addEventListener('click', () => {
                if (elements.shareModal) elements.shareModal.classList.remove('active');
            });
        }

        if (elements.shareModal) {
            elements.shareModal.addEventListener('click', (e) => {
                if (e.target === elements.shareModal) elements.shareModal.classList.remove('active');
            });
        }

        if (elements.btnCopyUrl) {
            elements.btnCopyUrl.addEventListener('click', () => {
                if (elements.shareUrlInput) {
                    copyTextToClipboard(elements.shareUrlInput.value, "Direct link copied to clipboard!");
                }
            });
        }

        if (elements.btnCopyEmbed) {
            elements.btnCopyEmbed.addEventListener('click', () => {
                if (elements.shareEmbedInput) {
                    copyTextToClipboard(elements.shareEmbedInput.value, "Embed code copied to clipboard!");
                }
            });
        }

        if (elements.headerActionBtn) {
            elements.headerActionBtn.addEventListener('click', () => toggleModal(true));
        }

        if (elements.modalClose) {
            elements.modalClose.addEventListener('click', () => toggleModal(false));
        }

        if (elements.authModal) {
            elements.authModal.addEventListener('click', (e) => {
                if (e.target === elements.authModal) toggleModal(false);
            });
        }

        if (elements.authSwitch) {
            elements.authSwitch.addEventListener('click', () => {
                isSignUpMode = !isSignUpMode;
                if (elements.authTitle) elements.authTitle.textContent = isSignUpMode ? "Create an account" : "Welcome back";
                if (elements.authSwitch) elements.authSwitch.textContent = isSignUpMode ? "Already have an account? Log in" : "Don't have an account? Sign up";
                if (elements.authMessage) elements.authMessage.style.display = 'none';
            });
        }

        if (elements.authForm) {
            elements.authForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (elements.authMessage) elements.authMessage.style.display = 'none';
                const btn = document.getElementById('auth-submit');
                const originalText = btn ? btn.textContent : 'Submit';
                if (btn) {
                    btn.textContent = 'Processing...';
                    btn.disabled = true;
                }
                
                try {
                    if (!auth) {
                        throw new Error("Authentication service is not initialized yet. Please wait a moment.");
                    }
                    if (isSignUpMode) {
                        if (auth.currentUser && auth.currentUser.isAnonymous) {
                            await signOut(auth);
                        }
                        await createUserWithEmailAndPassword(auth, elements.email.value, elements.password.value);
                    } else {
                        await signInWithEmailAndPassword(auth, elements.email.value, elements.password.value);
                    }
                    toggleModal(false);
                    showNotification('Successfully authenticated');
                } catch (error) {
                    if (elements.authMessage) {
                        let msg = 'An error occurred. Please try again.';
                        if (error.code === 'auth/email-already-in-use') {
                            msg = 'This email address is already registered.';
                        } else if (error.code === 'auth/weak-password') {
                            msg = 'Password should be at least 6 characters long.';
                        } else if (error.code === 'auth/invalid-email') {
                            msg = 'Please enter a valid email address.';
                        } else if (error.code === 'auth/invalid-credential') {
                            msg = 'Invalid email or password.';
                        } else if (error.message) {
                            msg = error.message;
                        }
                        elements.authMessage.textContent = msg;
                        elements.authMessage.style.display = 'block';
                    }
                } finally {
                    if (btn) {
                        btn.textContent = originalText;
                        btn.disabled = false;
                    }
                }
            });
        }

        if (elements.authLogout) {
            elements.authLogout.addEventListener('click', () => {
                if(auth) signOut(auth);
                toggleModal(false);
                showNotification('Signed out');
            });
        }

        const startDrag = () => {
            isDraggingState = true;
            document.body.style.cursor = window.innerWidth > 768 ? 'col-resize' : 'row-resize';
            if (elements.frame) elements.frame.style.pointerEvents = 'none';
        };

        const doDrag = (e) => {
            if (!isDraggingState || !elements.editorPanel) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            if (window.innerWidth > 768 && clientX) {
                const newWidth = ((clientX - 64) / (window.innerWidth - 64)) * 100;
                if (newWidth > 15 && newWidth < 85) elements.editorPanel.style.flex = `0 0 ${newWidth}%`;
            } else if (clientY) {
                const newHeight = ((clientY - 60) / (window.innerHeight - 60)) * 100;
                if (newHeight > 15 && newHeight < 85) elements.editorPanel.style.flex = `0 0 ${newHeight}%`;
            }
        };

        const stopDrag = () => {
            if (!isDraggingState) return;
            isDraggingState = false;
            document.body.style.cursor = '';
            if (elements.frame) elements.frame.style.pointerEvents = 'auto';
        };

        if (elements.resizer) {
            elements.resizer.addEventListener('mousedown', startDrag);
            elements.resizer.addEventListener('touchstart', startDrag, {passive: true});
        }
        document.addEventListener('mousemove', doDrag);
        document.addEventListener('touchmove', doDrag, {passive: true});
        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchend', stopDrag);

        window.addEventListener('resize', () => {
            if (elements.editorPanel) elements.editorPanel.style.flex = ''; 
        });

        loadUrlState();
        handleInput();
        setupFirebase();
    </script>
</body>
</html>
